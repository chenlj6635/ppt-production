name: Validate skill and library
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python skills/ppt-production/scripts/check_library.py skills/ppt-production/assets/library
      - run: python skills/ppt-production/scripts/render_catalog.py skills/ppt-production/assets/library
      - run: git diff --exit-code